<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BetBoost</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#121517">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121517;--panel:#1A1E21;--panel2:#20252A;--line:#2A3036;--text:#E4E7E9;--mute:#8A939B;--btn:#272D33;--btnh:#30373E;
--sage:#48DB9E;--sageD:#2FAE7A;--sageT:#6FE8B5;--sageBg:#192D27;--red:#FF5E5E;--redBg:#331F21;--ink:#0E1210;
--f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.4 var(--f)}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--sage);outline-offset:1px}
.n{font-variant-numeric:tabular-nums}
/* top bar */
.top{background:#0C0F11;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .in{max-width:1320px;margin:0 auto;height:52px;display:flex;align-items:stretch;padding:0 16px;gap:28px}
.word{display:flex;align-items:center;font:800 22px var(--f);font-stretch:85%;letter-spacing:-.3px;color:#fff}
.word span{color:var(--sage)}
.nav{display:flex;align-items:stretch}
.nav button{background:none;border:0;padding:0 14px;font:600 14px var(--f);color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.nav button.on{color:#fff;border-bottom-color:var(--sage)}
.nav button:hover{color:#fff}
.tools{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--mute);font-size:12.5px;white-space:nowrap}
.fmt{background:var(--btn);border:0;border-radius:3px;padding:5px 9px;font:600 12.5px var(--f);color:var(--text)}
/* time strip */
.times{background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:52px;z-index:25}
.times::-webkit-scrollbar{display:none}
.times .in{max-width:1320px;margin:0 auto;display:flex;padding:0 8px}
.times button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px 7px;white-space:nowrap;text-align:left;line-height:1.15}
.times button b{display:block;font:700 15px var(--f);font-stretch:80%;color:#fff}
.times button span{font-size:11.5px;color:var(--mute)}
.times button.on{border-bottom-color:var(--sage);background:var(--panel2)}
.times button.has b::after{content:"";display:inline-block;width:6px;height:6px;background:var(--sage);margin-left:6px;vertical-align:2px}
.rcg{background:var(--panel);border:1px solid var(--line);margin:16px 0 4px}
.rcgh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.rcgh b{color:#fff;font:700 14px var(--f)}.rcgh span{font-size:12px;color:var(--mute)}
.rcr{display:flex;border-bottom:1px solid var(--line)}.rcr:last-child{border-bottom:0}
.rcm{width:130px;flex:none;padding:0 14px;color:var(--text);font-size:13.5px;border-right:1px solid var(--line);display:flex;align-items:center}
.rcts{display:flex;flex-wrap:wrap}
.rcts button{width:64px;height:40px;background:none;border:0;border-right:1px solid var(--line);color:var(--text);font:600 13.5px var(--f);cursor:pointer;position:relative}
.rcts button:hover{background:var(--btnh)}
.rcts button.done{color:var(--mute)}
.rcts button.has::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;background:var(--sage)}
.rcts button.nx{background:var(--sageD);color:#fff}.rcts button.nx.has::after{background:#fff}
@media(max-width:640px){.rcm{width:86px;padding:0 10px;font-size:12.5px}.rcts button{width:54px}}
/* layout */
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr) 330px;gap:0;align-items:start}
.side{border-right:1px solid var(--line);min-height:calc(100vh - 100px);padding:10px 0;position:sticky;top:100px}
.side h3{font:600 12px var(--f);color:var(--mute);margin:10px 16px 6px}
.side button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:8px 16px;text-align:left;font:500 14px var(--f);color:var(--text)}
.side button small{color:var(--mute)}
.side button.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--sage);color:#fff}
.side button:hover{background:var(--panel)}
.card{min-width:0;border-right:1px solid var(--line)}
/* race */
.race{border-bottom:8px solid #0C0F11;scroll-margin-top:110px}
.rhead{display:grid;grid-template-columns:auto 1fr auto;gap:2px 16px;align-items:end;padding:16px 18px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.rt{font:800 30px/1 var(--f);font-stretch:75%;color:#fff;grid-row:1/3;align-self:start}
.rc{font:700 18px var(--f);font-stretch:85%;color:#fff}
.rn{font-size:12.5px;color:var(--mute);grid-column:2}
.rmeta{grid-row:1/3;grid-column:3;text-align:right;font-size:12px;color:var(--mute)}
.rmeta b{display:block;color:var(--sageT);font:600 12.5px var(--f)}
.th,.ru{display:grid;grid-template-columns:44px minmax(0,1fr) 58px 58px 64px 92px;gap:6px;align-items:center;padding:0 18px}
.th{height:30px;font:600 11.5px var(--f);color:var(--mute);border-bottom:1px solid var(--line);background:var(--panel2)}
.th span{text-align:center}
.ru{min-height:58px;border-bottom:1px solid var(--line)}
.ru:hover{background:#171B1E}
.ru.pick{background:var(--sageBg);box-shadow:inset 3px 0 0 var(--sage)}
.cn{font:700 15px var(--f);color:#fff;text-align:center;line-height:1.1}.cn small{display:block;font:500 11px var(--f);color:var(--mute)}
.hn{font:700 15px var(--f);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bfl{display:inline-block;line-height:0;margin-right:7px;vertical-align:-3px}.bfl img{width:17px;height:17px;border-radius:3px}.nxhw{display:flex;align-items:center;gap:11px;margin:10px 0 3px}.nxhw .nxh{margin:0}.nxhw .bfl{margin:0;flex:none}.nxhw .bfl img{width:26px;height:26px;border-radius:5px}
.ladbet{font-style:normal;font-size:10.5px;font-weight:700;padding:1px 5px;margin-left:2px}.ladbet.ok{background:var(--sageBg);color:var(--sageT)}.ladbet.pt{background:#3A2E12;color:#F5B83D}.ladbet.no{background:var(--btn);color:var(--mute)}
.ladbets{background:var(--panel);border:1px solid var(--line);margin:0 0 10px}.ladbh{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}.ladbh span{color:var(--mute);font-size:12px}
.ladbets table{width:100%;border-collapse:collapse;font-size:12.5px}.ladbets td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.ladbets tr:last-child td{border-bottom:0}.ladbets td.lbn{font-weight:700;color:#fff;white-space:normal}.ladbets td.lbt{color:var(--mute);font-size:11.5px}.ladbets small{color:var(--mute)}
.ladbs{font-weight:700;padding:1px 6px;font-size:11.5px}.ladbs.ok{background:var(--sageBg);color:var(--sageT)}.ladbs.pt,.ladbs.wt{background:#3A2E12;color:#F5B83D}.ladbs.no{background:var(--redBg);color:var(--red)}
.ladbp{font-size:10.5px;font-weight:700;padding:1px 6px}.ladbp.ok{background:var(--sageBg);color:var(--sageT)}.ladbp.pt,.ladbp.wt{background:#3A2E12;color:#F5B83D}.ladbp.no{background:var(--redBg);color:var(--red)}
.ladrb{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.ladow,.ladom{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:#F5B83D}.ladom{position:relative;color:var(--sageT);padding-left:4px}
.ladbets{max-width:100%;overflow-x:auto}
@media (max-width:700px){.ladbets td:nth-child(3),.ladbets td.lbt{display:none}.ladbets td{white-space:normal;padding:6px 7px}.ladm{padding:12px 10px}}
/* Ladder tab (19 Nov 2026) */
.lad{display:grid;grid-template-columns:220px auto 300px;justify-content:center;gap:0;max-width:1320px;margin:0 auto;min-height:calc(100vh - 60px)}
.ladl{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:52px}
.ladtypes{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}.ladtypes button{flex:1;background:none;border:0;color:var(--mute);font:600 12.5px var(--f);padding:10px 4px;cursor:pointer;border-bottom:2px solid transparent}.ladtypes button.on{color:var(--text);border-bottom-color:var(--sage)}
.ladday{padding:10px 12px 4px;font-size:11.5px;color:var(--mute)}
.ladmk{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:9px 12px;cursor:pointer;text-align:left;font:13px var(--f)}.ladmk:hover{background:var(--panel2)}.ladmk.on{background:var(--sageBg)}
.ladmk b{font-weight:700;width:42px;flex:none}.ladmk span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ladmk em{font-style:normal;font-size:11.5px;color:var(--mute)}.ladmk em.soon{color:var(--sageT)}.ladmk em.ip{color:#F5B83D}.ladpk{color:var(--sage);font-style:normal;font-size:10px}
.ladmsg{padding:16px;color:var(--mute);font-size:13px;line-height:1.5}
.ladm{padding:14px 16px;min-width:0}.ladhd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}.ladhd b{font-size:18px;margin-right:10px}.ladhd span{color:var(--mute);font-size:13px}.ladstat{color:var(--mute);font-size:12px}
.ladbadge{display:inline-block;margin-left:10px;padding:2px 7px;font-size:11px;font-weight:700;background:var(--btn);color:var(--text)}.ladbadge.ip{background:#3A2E12;color:#F5B83D}.ladbadge.sus{background:var(--redBg);color:var(--red)}
.ladg{width:auto;border-collapse:separate;border-spacing:1px 1px}.ladg th{font-size:11.5px;color:var(--mute);font-weight:600;padding:2px}.ladg th.ln{text-align:left}
.ladg td.ln{padding:6px 14px 6px 0;min-width:220px;max-width:330px}.lnn{font-weight:700;font-size:14px;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.lnn i{font-style:normal;color:var(--mute);font-weight:600;font-size:12px;min-width:16px}.lns{font-size:11.5px;color:var(--mute);margin-top:2px}
.lnn.lnpick{color:var(--sageT)}
.ladpkb{font-size:10.5px;font-weight:700;background:var(--sageBg);color:var(--sageT);padding:1px 6px}
.ladg tr{cursor:pointer}.ladg tr.sel td.ln{box-shadow:inset 3px 0 0 var(--sage);padding-left:8px}.ladg tr.nr{opacity:.45}.ladg tr.won .lnn{color:var(--sageT)}
.lc{width:62px;height:42px;text-align:center;vertical-align:middle;padding:0}.lc b{display:block;font:700 14px var(--f);color:#0B1B26}.lc small{display:block;font-size:10.5px;color:#28404F}
.lc.bk{background:#A6D8FF}.lc.ly{background:#FAC9D1}.lc.bk:not(.b1){background:#D4EBFC}.lc.ly:not(.b1){background:#FCE3E7}.lc.ly small{color:#4F2A30}.lc.emp{background:var(--panel2)!important}
th.lc{height:auto;background:none!important}
.ladr{border-left:1px solid var(--line);background:var(--panel);position:sticky;top:52px;max-height:calc(100vh - 60px);overflow-y:auto}
.ladrh{padding:12px;border-bottom:1px solid var(--line)}.ladrh b{display:block;font-size:15px}.ladrh span{font-size:12px;color:var(--mute)}
.ladl2{width:100%;border-collapse:collapse;font-size:12.5px}.ladl2 th{font-size:11px;color:var(--mute);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.ladl2 td{padding:3px 4px;border-bottom:1px solid var(--line);height:22px}.ladl2 td.bk{text-align:right;color:#7FC3FF;width:22%}.ladl2 td.ly{text-align:left;color:#F79AAB;width:22%}.ladl2 td.px{text-align:center;font-weight:700;width:16%;background:var(--panel2)}
.ladl2 td.tr{position:relative}.ladl2 td.tr i{position:absolute;left:0;top:3px;bottom:3px;background:rgba(232,117,26,.35)}.ladl2 td.tr span{position:relative;font-size:11px;color:var(--mute);padding-left:4px}
.ladl2 tr.ltp td.px{background:#3A2E12;color:#F5B83D}.ladl2 tr.pmin td.px{box-shadow:inset 0 0 0 2px var(--sage)}
@media (max-width:980px){.lad{grid-template-columns:minmax(0,1fr)}.ladg{width:100%}.ladg td.ln{min-width:0}.ladl,.ladr{position:static;max-height:none;border:0;border-bottom:1px solid var(--line)}.ladl{max-height:220px;overflow-y:auto}}
@media (max-width:560px){.ladg .h2,.ladg .h3{display:none}.ladg td.lc:nth-child(2),.ladg td.lc:nth-child(3),.ladg td.lc:nth-child(6),.ladg td.lc:nth-child(7){display:none}.lc{width:56px}}
.hd{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd i{font-style:normal;color:#B5BCC2}
.ob{height:42px;border-radius:3px;background:var(--btn);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 15px var(--f);color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.ob small{font:500 10px var(--f);color:var(--mute);margin-top:3px}
.ob.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.ob.val{background:var(--sage);color:var(--ink)}.ob.val small{color:#0B3D2A}
.ob.na{color:#525A61}
.mv{font:700 13px var(--f);text-align:center}.mv.up{color:var(--sageT)}.mv.dn{color:var(--red)}
.bks{display:block}
.bks .ob{height:42px}
/* slip */
.slip{position:sticky;top:100px;max-height:calc(100vh - 100px);overflow:auto}
.slip .sh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.slip .sh b{font:800 18px var(--f);font-stretch:85%;color:#fff}.slip .sh span{color:var(--mute);font-size:12.5px}
.slip .ri{padding:8px 16px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);background:var(--panel)}
.leg{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.leg:hover{background:var(--panel)}
.leg .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.leg .hn{font-size:14.5px}.leg .hd{font-size:12px}
.need{min-width:62px;text-align:center;background:var(--sage);color:var(--ink);border-radius:3px;padding:5px 6px}
.need small{display:block;font:600 10px var(--f);color:#0B3D2A}.need b{font:800 18px var(--f);font-variant-numeric:tabular-nums}
.l2{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--mute)}
.l2 .ok{color:var(--sageT)}.l2 .no{color:var(--red)}.l2 b{color:var(--text);font-weight:600}
.empty{padding:22px 18px;color:var(--mute)}
.foot{padding:14px 16px;font-size:12px;color:var(--mute);line-height:1.5}
.banner{background:#2A2516;color:#E5D8A8;padding:9px 16px;text-align:center;font-size:13px;border-bottom:1px solid var(--line)}
/* v13 layout: picks across the top, full-width race tables with every bookmaker */
.main{max-width:1760px;margin:0 auto;padding:0 0 30px}
.picks{padding:14px 16px 16px;border-bottom:8px solid #0C0F11}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px}
.ph b{font:800 20px var(--f);font-stretch:85%;color:#fff}.ph .tot{color:var(--sageT);font:700 14px var(--f)}.ph span{color:var(--mute);font-size:12.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:3px;padding:10px 12px;cursor:pointer;min-width:0}
.pc:hover{background:var(--panel2)}.pc.old{border-left-color:#6B7A70;opacity:.92}
.pc .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc .hn{font-size:15px}.pc .hd{font-size:12px}
.pc .l2{margin-top:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 10px}
.chips button{background:var(--btn);border:0;border-radius:14px;padding:5px 12px;font:600 12.5px var(--f);color:var(--text)}
.chips button small{color:var(--mute);font-weight:500;margin-left:4px}
.chips button.on{background:var(--sage);color:var(--ink)}.chips button.on small{color:#0B3D2A}
.tw{overflow-x:auto;scrollbar-width:thin}
table.rt2{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.rt2 th{font:600 11px var(--f);color:var(--mute);background:var(--panel2);padding:7px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.rt2 td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;font:600 14px var(--f);color:#D6DADD;white-space:nowrap;background:var(--bg)}
.rt2 tr:hover td{background:#171B1E}
.rt2 tr.pick td{background:var(--sageBg)}
.rt2 .s1{position:sticky;left:0;z-index:2;width:40px;min-width:40px}
.rt2 .s2{position:sticky;left:40px;z-index:2;text-align:left;min-width:180px;max-width:240px;padding-left:8px;box-shadow:1px 0 0 var(--line)}
.rt2 tr.pick .s1{box-shadow:inset 3px 0 0 var(--sage)}
.rt2 td.s2{white-space:normal}
.rt2 .bf{min-width:66px}.rt2 .our{min-width:54px;color:var(--mute)}.rt2 .mvc{min-width:52px}
.rt2 .bk{min-width:44px;font-weight:500;font-size:13.5px}
.rt2 td.bk.bst{color:#fff;font-weight:800}
.rt2 td.bk.val{background:var(--sage)!important;color:var(--ink);font-weight:800}
.rt2 td.bk.na{color:#4A5258}
.rt2 .sub{display:block;font:500 10px var(--f);color:var(--mute)}
.rt2 td.bf.val{background:var(--sage)!important;color:var(--ink)}.rt2 td.bf.val .sub{color:#0B3D2A}
.rt2 .bfgap{border-left:1px solid var(--line)}
.ptab td{background:var(--sageBg)}.ptab tr:hover td{background:#1D3830}
.ptab .stk{min-width:62px;color:#fff}.ptab .sta{min-width:120px;font:500 12px var(--f);text-align:left;white-space:normal}
.ptab .hd .ok{color:var(--sageT)}.ptab .hd .mu,.ptab .hd span{color:var(--mute)}.ptab .hd .ok{color:var(--sageT)}
.ptab td.mn b{font:800 16px var(--f);color:#fff}
.rt2 td.low{color:#7E878E}.rt2 td.bf.low{color:var(--red)}
.picks .tw{border:1px solid var(--line);border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:8px 16px 0;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.r4{display:block;font:500 10px var(--f);color:var(--mute)}
/* results */
.res{max-width:1320px;margin:0 auto;padding:18px 16px 40px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:3px;margin-bottom:16px}
.seg button{background:none;border:0;padding:7px 14px;font:600 13px var(--f);color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--panel2);color:#fff;box-shadow:inset 0 -2px 0 var(--sage)}
.kp{display:grid;grid-template-columns:1.6fr repeat(5,1fr);border:1px solid var(--line);margin-bottom:16px}
.kp div{padding:14px 16px;border-right:1px solid var(--line)}.kp div:last-child{border-right:0}
.kp b{display:block;font:800 28px/1.05 var(--f);font-stretch:80%;color:#fff;font-variant-numeric:tabular-nums}
.kp .big b{font-size:44px}.kp span{font-size:12px;color:var(--mute)}
.pos{color:var(--sageT)!important}.neg{color:var(--red)!important}
.chart{border:1px solid var(--line);padding:12px 16px 8px;margin-bottom:16px;background:var(--panel)}
.chart svg{width:100%;height:170px;display:block}
.dt{border:1px solid var(--line)}
.dr{display:grid;grid-template-columns:1.5fr repeat(5,1fr) 20px;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;font-variant-numeric:tabular-nums}

<script>
const SBC={"u": "https://lmjfcewzioykvgqiiusu.supabase.co", "k": "sb_publishable_byGOIvqp2XIF6A4IuOAkKA_IaS9f0eW"};
// ---- BetBoost v2 (20 Nov 2026, Rich): proper logins instead of a shared password. Supabase Auth (invite only) with
// two-step login (Microsoft Authenticator or any authenticator app). The page holds no data: after login it downloads
// the picks/results/live prices from Supabase's private file store (owner data only for the admin) - see
// tools/supabase_publish.py. Friends' bets are rows in Supabase (bets table) - see supabase/01_schema.sql.
const H0=new URLSearchParams(location.hash.slice(1)),Q0=new URLSearchParams(location.search);
const LINK_TYPE=H0.get("type")||"",LINK_ERR=H0.get("error_description")||Q0.get("error_description")||"";
try{if(LINK_TYPE=="invite"||LINK_TYPE=="recovery")sessionStorage.setItem("bb_needpw",LINK_TYPE)}catch(e){}
const SB=supabase.createClient(SBC.u,SBC.k,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"implicit",storageKey:"bb_auth"}});
let ROLE=null,ME=null;
const au=()=>document.getElementById("au");
const auSay=(t,bad)=>{const m=document.getElementById("aum");if(m){m.textContent=t||"";m.className="aum"+(bad?" bad":"")}};
const W=`<div class="word">Bet<span>Boost</span></div>`;
function needPw(){try{return sessionStorage.getItem("bb_needpw")||""}catch(e){return ""}}
async function authFlow(){try{
  const {data:{session}}=await SB.auth.getSession();
  if(!session)return showLogin(LINK_ERR?"That link has expired or has already been used. Ask Rich for a new one.":"");
  const {data:a,error}=await SB.auth.mfa.getAuthenticatorAssuranceLevel();if(error)throw error;
  if(a.nextLevel=="aal2"&&a.currentLevel!="aal2")return showCode();
  if(needPw())return showSetPw(needPw());
  if(a.currentLevel!="aal2")return showEnroll();
  return openSite()}
 catch(e){showLogin("Something went wrong ("+(e.message||e)+"). Try again.")}}
function showLogin(msg){document.getElementById("lock").hidden=false;document.getElementById("app").hidden=true;
 au().innerHTML=`${W}<form id="lf"><input id="le" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
 <input id="lp" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required><button type="submit">Log in</button>
 <p id="aum" class="aum"></p><p class="auh"><a href="#" id="afg">Forgotten your password?</a></p></form>`;
 auSay(msg,!!msg);document.getElementById("afg").onclick=e=>{e.preventDefault();showForgot(document.getElementById("le").value)};
 document.getElementById("lf").onsubmit=async e=>{e.preventDefault();auSay("Logging in…");
  const {error}=await SB.auth.signInWithPassword({email:document.getElementById("le").value.trim(),password:document.getElementById("lp").value});
  if(error)return auSay(/invalid/i.test(error.message)?"Wrong email or password.":error.message,true);authFlow()}}
function showForgot(email){au().innerHTML=`${W}<form id="ff"><p class="aut">Enter your email and we'll send you a link to choose a new password.</p>
 <input id="fe" type="email" autocomplete="username" placeholder="Email" aria-label="Email" required value="${esc(email||"")}"><button type="submit">Send reset link</button>
 <p id="aum" class="aum"></p><p class="auh"><a href="#" id="fbk">Back to log in</a></p></form>`;
 document.getElementById("fbk").onclick=e=>{e.preventDefault();showLogin("")};
 document.getElementById("ff").onsubmit=async e=>{e.preventDefault();auSay("Sending…");
  const {error}=await SB.auth.resetPasswordForEmail(document.getElementById("fe").value.trim(),{redirectTo:location.origin+location.pathname});
  if(error)return auSay(/rate|seconds/i.test(error.message)?"Please wait a minute before asking for another link.":error.message,true);
  auSay("If there's a BetBoost login for that email, a reset link is on its way. Check your inbox (and junk folder).")}}
function codeBox(id){return `<input id="${id}" class="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="123456" aria-label="6-digit code" required>`}
const outLink=`<p class="auh"><a href="#" id="aout">Log out</a></p>`;
function wireOut(){const a=document.getElementById("aout");if(a)a.onclick=async e=>{e.preventDefault();await SB.auth.signOut();try{sessionStorage.removeItem("bb_needpw")}catch(x){}showLogin("")}}
async function showCode(){au().innerHTML=`${W}<form id="cf"><p class="aut">Enter the 6-digit code from your authenticator app.</p>${codeBox("cc")}<button type="submit">Continue</button>
 <p id="aum" class="aum"></p><p class="auh">Lost your phone? Ask Rich to reset your two-step login.</p>${outLink}</form>`;wireOut();
 const c=document.getElementById("cc");c.focus();
 document.getElementById("cf").onsubmit=async e=>{e.preventDefault();auSay("Checking…");
  const {data:f}=await SB.auth.mfa.listFactors();const t=(f&&f.totp||[])[0];if(!t)return showEnroll();
  const {error}=await SB.auth.mfa.challengeAndVerify({factorId:t.id,code:c.value.replace(/\D/g,"")});
  if(error)return auSay("That code didn't work. Use the newest code (they change every 30 seconds).",true);authFlow()}}
function showSetPw(kind){au().innerHTML=`${W}<form id="pf"><p class="aut">${kind=="invite"?"Welcome. Choose a password for your BetBoost login.":"Choose a new password."}</p>
 <input id="p1" type="password" autocomplete="new-password" placeholder="New password (at least 10 characters)" aria-label="New password" minlength="10" required>
 <input id="p2" type="password" autocomplete="new-password" placeholder="Type it again" aria-label="Type it again" required><button type="submit">Save password</button><p id="aum" class="aum"></p>${outLink}</form>`;wireOut();
 document.getElementById("pf").onsubmit=async e=>{e.preventDefault();const a=document.getElementById("p1").value,b=document.getElementById("p2").value;
  if(a.length<10)return auSay("Use at least 10 characters.",true);if(a!=b)return auSay("The two passwords don't match.",true);auSay("Saving…");
  const {error}=await SB.auth.updateUser({password:a});
  if(error&&!/different from the old/i.test(error.message))return auSay(error.message,true);
  try{sessionStorage.removeItem("bb_needpw")}catch(x){}authFlow()}}
async function showEnroll(){au().innerHTML=`${W}<p class="aum">Setting up…</p>`;
 try{const {data:f}=await SB.auth.mfa.listFactors();for(const x of (f&&f.all||[]))if(x.status!="verified")await SB.auth.mfa.unenroll({factorId:x.id});
  const {data,error}=await SB.auth.mfa.enroll({factorType:"totp",issuer:"BetBoost",friendlyName:"Authenticator "+new Date().toISOString().slice(0,16)});if(error)throw error;
  const key=data.totp.secret.replace(/(.{4})/g,"$1 ").trim();
  au().innerHTML=`${W}<form id="ef" class="wide"><p class="aut"><b>Set up two-step login.</b> Each time you log in you'll also type a code from an app on your phone.</p>
  <ol class="aus"><li>Open <b>Microsoft Authenticator</b> (or Google Authenticator), tap <b>+</b>, choose <b>Other account</b> and scan this code.</li></ol>
  <img class="qr" src="${esc(data.totp.qr_code)}" alt="QR code for your authenticator app">
  <p class="auh">On this phone? <a href="${esc(data.totp.uri)}">Open in authenticator app</a>, or enter this key by hand:<br><code>${esc(key)}</code></p>
  <ol class="aus" start="2"><li>Type the 6-digit code the app shows.</li></ol>${codeBox("ec")}<button type="submit">Finish</button><p id="aum" class="aum"></p>${outLink}</form>`;wireOut();
  document.getElementById("ef").onsubmit=async e=>{e.preventDefault();auSay("Checking…");
   const {error}=await SB.auth.mfa.challengeAndVerify({factorId:data.id,code:document.getElementById("ec").value.replace(/\D/g,"")});
   if(error)return auSay("That code didn't work. Check you scanned the code above and use the newest code.",true);authFlow()}}
 catch(e){au().innerHTML=`${W}<p class="aum bad">Couldn't start two-step setup (${esc(e.message||e)}).</p>${outLink}`;wireOut()}}
// ---- data from the private file store

 const r=await fetch(`${SBC.u}/storage/v1/object/authenticated/site/${path}`,{headers:{apikey:SBC.k,Authorization:"Bearer "+session.access_token},cache:"no-store"});
 if(!r.ok)throw new Error("HTTP "+r.status);return await r.arrayBuffer()}
async function sbJson(path){return JSON.parse(await gunz(await sbRaw(path)))}
async function sbVer(){try{return JSON.parse(new TextDecoder().decode(await sbRaw((GUEST?"guest":"owner")+"/v.json"))).v}catch(e){return null}}
async function openSite(){try{
  const {data:{user}}=await SB.auth.getUser();
  const {data:pr}=await SB.from("profiles").select("role,display_name").eq("user_id",user.id).maybeSingle();
  ROLE=pr&&pr.role||"friend";ME={id:user.id,name:pr&&pr.display_name||"",email:user.email};GUEST=ROLE!="admin";
  au().innerHTML=`${W}<p class="aum">Loading…</p>`;
  D=await sbJson((GUEST?"guest":"owner")+"/site.json.gz");SITE_D=await sbVer();
  document.getElementById("lock").hidden=true;document.getElementById("app").hidden=false;
  if(GUEST){MYB=null;myInit()}draw();startLive()}
 catch(e){au().innerHTML=`${W}<p class="aum bad">${/HTTP 4/.test(e.message)?"The site's data isn't there yet. Rich: rebuild the site (command 15).":"Couldn't load the site ("+esc(e.message||e)+"). Try again shortly."}</p>${outLink}`;wireOut()}}
document.addEventListener("click",e=>{if(e.target.closest("#lo")){SB.auth.signOut().finally(()=>{try{sessionStorage.removeItem("bb_needpw")}catch(x){}location.replace(location.pathname)})}});
// ---- live prices and site updates, now from the file store (replaces the GitHub/encrypted versions)
async function pollLive(){try{if(!D||document.visibilityState=="hidden")return;const L=await sbJson((GUEST?"guest":"owner")+"/live.json.gz");
 LIVEDATA=L;LIVE_AT=L.t;if(GUEST){applyLiveG(L);if(!typing())draw();return}applyLive(L);if(day>=0&&!typing())draw()}catch(e){}}
async function pollSite(){try{if(!D||document.visibilityState=="hidden")return;
 try{const r=await fetch(location.pathname+"?t="+Date.now(),{cache:"no-store"});if(r.ok){const cv=((await r.text()).match(/const CODEV="([^"]*)"/)||[])[1];
  if(cv&&cv!=CODEV){try{sessionStorage.setItem("bb_view",JSON.stringify({day,rrun,tv,hf,gday}))}catch(e){}location.reload();return}}}catch(e){}
 const v=await sbVer();if(!v||v==SITE_D)return;const nd=await sbJson((GUEST?"guest":"owner")+"/site.json.gz");
 if(GUEST){D=nd;SITE_D=v;if(LIVEDATA)applyLiveG(LIVEDATA);if(!typing())draw();return}
 const lab=day>=0&&D.days[day]?D.days[day].label:null;D=nd;SITE_D=v;_hk=null;if(lab){const i=D.days.findIndex(d=>d.label==lab);day=i>=0?i:0}if(LIVEDATA)applyLive(LIVEDATA);if(!typing())draw()}catch(e){}}
function startLive(){try{const v=JSON.parse(sessionStorage.getItem("bb_view")||"null");if(v){sessionStorage.removeItem("bb_view");if(GUEST)gday=v.gday||0;else{day=Math.min(v.day,D.days.length-1);rrun=v.rrun;tv=v.tv;hf=v.hf}draw()}}catch(e){}
 pollLive();setInterval(pollLive,60000);setInterval(pollSite,60000);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"){pollLive();pollSite()}})}
// ---- friends' bets in Supabase (row-level security: each person sees their own; the admin sees everyone's)
const myRow=b=>({id:b.id,k:b.race_date+"|"+b.race_time+"|"+b.horse,date:b.race_date,time:b.race_time,horse:b.horse,course:b.course,min:b.pick_min==null?null:+b.pick_min,
 book:b.bookmaker,price:+b.price,stake:+b.stake,at:b.created_at,result:b.result,pnl:b.pnl==null?null:+b.pnl,rule4:+b.rule4||0});
async function myInit(){try{const {data,error}=await SB.from("bets").select("*").eq("user_id",ME.id).order("race_date",{ascending:false}).limit(2000);if(error)throw error;
 MYB=data.map(myRow);draw()}catch(e){MYB=MYB||null;gmsg="Couldn't load your bets - try again shortly.";draw()}}
function myPL(b,r){if(b.result&&b.result!="pending"&&b.pnl!=null)return b.pnl;if(!r||!r.result||r.result=="pending")return null;if(r.result=="non-runner")return 0;
 return r.result=="won"?b.stake*(b.price-1)*(b.book=="Betfair"?0.98:1):-b.stake}
function myFlash(t){gmsg=t;draw();setTimeout(()=>{if(gmsg==t){gmsg="";draw()}},3000)}
function myWire(app){
 app.querySelectorAll("[data-myrec]").forEach(b=>b.onclick=()=>{gform={k:b.dataset.myrec};draw()});
 app.querySelectorAll("[data-mycancel]").forEach(b=>b.onclick=()=>{gform=null;draw()});
 ["book","price","stake"].forEach(n=>{const el=document.getElementById("mf_"+n);if(el)el.oninput=el.onchange=()=>{gform[n]=el.value}});
 app.querySelectorAll("[data-mysave]").forEach(b=>b.onclick=async()=>{const k=b.dataset.mysave,price=parseFloat(document.getElementById("mf_price").value),stake=parseFloat(document.getElementById("mf_stake").value),book=document.getElementById("mf_book").value;
  if(!(price>1)){gmsg="Enter the price you got (e.g. 7.5).";draw();return}if(!(stake>0)){gmsg="Enter your stake.";draw();return}
  const [d,time,...h]=k.split("|"),horse=h.join("|"),p=(D.today&&D.today.picks||[]).find(q=>q.time==time&&q.horse==horse),ex=(MYB||[]).find(x=>x.k==k);
  b.disabled=true;b.textContent="Saving…";
  const q=ex&&ex.id?SB.from("bets").update({price,bookmaker:book,stake}).eq("id",ex.id):
   SB.from("bets").insert({race_date:d,race_time:time,course:p?p.course:"",market_id:p&&p.market_id!=null?String(p.market_id):null,selection_id:p&&p.sid!=null?+p.sid:null,horse,is_pick:true,pick_min:p?p.min:null,price,bookmaker:book,stake});
  const {data,error}=await q.select().single();
  if(error){b.disabled=false;b.textContent="Save";gmsg=/started/i.test(error.message)?"That race has started - bets can only be added or changed before the off.":"Couldn't save ("+error.message+").";draw();return}
  MYB=(MYB||[]).filter(x=>x.k!=k);MYB.push(myRow(data));gform=null;myFlash("Saved.")});
 app.querySelectorAll("[data-mydel]").forEach(b=>b.onclick=async()=>{const ex=(MYB||[]).find(x=>x.k==b.dataset.mydel);if(!ex)return;
  const {error}=await SB.from("bets").delete().eq("id",ex.id);if(error){gmsg="Couldn't remove it ("+error.message+").";draw();return}
  MYB=MYB.filter(x=>x!==ex);gform=null;myFlash("Removed.")});
 app.querySelectorAll("[data-gres]").forEach(b=>b.onclick=()=>{gres=b.dataset.gres;draw()})}
// ---- admin: everyone's bets and the league (day -4)
let FRS={rows:null,prof:{},at:0,err:"",sel:"All",people:null,perr:"",msg:"",busy:false};
async function adminCall(body){const {data,error}=await SB.functions.invoke("admin",{body:{...body,site:location.origin+location.pathname}});
 if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(x){}throw new Error(m)}return data}
async function adminAct(body,ask){if(ask&&!confirm(ask))return;FRS.busy=true;FRS.msg="Working…";draw();
 try{const r=await adminCall(body);FRS.msg=r.msg||"Done.";FRS.at=0;await friendsLoad()}catch(e){FRS.msg="Couldn't do that: "+(e.message||e)}FRS.busy=false;draw()}
async function friendsLoad(){if(Date.now()-FRS.at<60000)return;FRS.at=Date.now();
 try{const [b,p]=await Promise.all([SB.from("bets").select("*").order("race_date",{ascending:false}).order("race_time",{ascending:false}).limit(3000),SB.from("profiles").select("user_id,display_name,role")]);
  if(b.error)throw b.error;FRS.rows=b.data;FRS.prof=Object.fromEntries((p.data||[]).map(x=>[x.user_id,x]));FRS.err=""}catch(e){FRS.err=e.message||String(e)}
 try{FRS.people=(await adminCall({action:"list"})).people;FRS.perr=""}catch(e){FRS.perr=e.message||String(e)}
 if(day==-4&&!typing())draw()}
function peoplePart(){let h=`<div class="dh2"><b>People</b><span>invite friends by email · they choose their own password and set up two-step login</span></div>
 <form class="inv" id="invf"><input id="inv_n" placeholder="Name" aria-label="Name" required><input id="inv_e" type="email" placeholder="Email" aria-label="Email" required><button type="submit"${FRS.busy?" disabled":""}>Send invite</button></form>`;
 if(FRS.msg)h+=`<div class="gmsg">${esc(FRS.msg)}</div>`;
 if(FRS.perr)return h+`<div class="empty" style="padding-left:0">Couldn't load the people list (${esc(FRS.perr)}). Is the "admin" Edge Function set up in Supabase?</div>`;
 if(!FRS.people)return h+`<div class="empty" style="padding-left:0">Loading…</div>`;
 const P=FRS.people.slice().sort((a,b)=>((!!b.me)-(!!a.me))||(a.name||a.email).localeCompare(b.name||b.email));
 return h+`<table class="lg pp"><thead><tr><th class="l">Name</th><th class="l">Email</th><th class="l">Status</th><th></th></tr></thead><tbody>`+P.map(u=>`<tr><td class="l">${esc(u.name)}${u.role=="admin"?" <small>admin</small>":""}</td><td class="l">${esc(u.email)}</td>
 <td class="l">${u.blocked?`<span class="neg">Blocked</span>`:!u.joined?"Invited, not joined yet":u.mfa?"Active":"Joined, no two-step yet"}</td><td class="act">${
  !u.joined&&!u.me?`<button class="mfl" data-pa="invite" data-pe="${esc(u.email)}" data-pn="${esc(u.name)}">Resend invite</button>`:""}${
  u.mfa&&!u.me?`<button class="mfl" data-pa="reset2fa" data-pid="${u.id}" data-pq="Reset ${esc(u.name||u.email)}'s two-step login? They'll scan a new QR code at their next login.">Reset 2FA</button>`:""}${
  u.me?"":`<button class="mfl" data-pa="${u.blocked?"unblock":"block"}" data-pid="${u.id}"${u.blocked?"":` data-pq="Block ${esc(u.name||u.email)}? They won't be able to log in."`}>${u.blocked?"Unblock":"Block"}</button>`}</td></tr>`).join("")+`</tbody></table>`}
function friendsPage(){let h=`<div class="hz">${peoplePart()}<div class="dh2" style="margin-top:26px"><b>Friends' bets</b><span>everyone's recorded bets and points · Rule 4 and Betfair commission included once settled</span></div>`;
 if(FRS.err)return h+`<div class="empty" style="padding-left:0">Couldn't load the bets (${esc(FRS.err)}).</div></div>`;
 if(!FRS.rows)return h+`<div class="empty" style="padding-left:0">Loading…</div></div>`;
 const nm=u=>(FRS.prof[u]||{}).display_name||"?",by={};
 FRS.rows.forEach(b=>{const s=by[b.user_id]||(by[b.user_id]={n:0,w:0,st:0,pl:0,pend:0});if(b.result=="pending")s.pend++;else if(b.result=="won"||b.result=="lost"){s.n++;s.st+=+b.stake;s.pl+=+(b.pnl||0);if(b.result=="won")s.w++}});
 const L=Object.entries(by).sort((a,b)=>b[1].pl-a[1].pl);
 if(!L.length)return h+`<div class="empty" style="padding-left:0">No bets recorded yet.</div></div>`;
 h+=`<table class="lg"><thead><tr><th class="l">Name</th><th>Bets</th><th>Won</th><th>Staked</th><th>Profit</th><th>Return</th><th>To run</th></tr></thead><tbody>`+
  L.map(([u,s])=>`<tr data-fu="${esc(u)}" class="${FRS.sel==u?"on":""}"><td class="l">${esc(nm(u))}</td><td>${s.n}</td><td>${s.w}</td><td>£${s.st.toFixed(2)}</td><td class="${cls(s.pl)}">${s.pl<0?"−":"+"}£${Math.abs(s.pl).toFixed(2)}</td><td class="${cls(s.pl)}">${s.st?(s.pl/s.st*100>0?"+":"")+(s.pl/s.st*100).toFixed(1)+"%":"–"}</td><td>${s.pend}</td></tr>`).join("")+`</tbody></table>`;
 h+=`<div class="seg" style="margin-top:14px"><button class="${FRS.sel=="All"?"on":""}" data-fu="All">Everyone</button>${L.map(([u])=>`<button class="${FRS.sel==u?"on":""}" data-fu="${esc(u)}">${esc(nm(u))}</button>`).join("")}</div>`;
 const R=FRS.rows.filter(b=>FRS.sel=="All"||b.user_id==FRS.sel).slice(0,300);
 h+=R.map(b=>{const v=b.pnl==null?null:+b.pnl,res=b.result;return `<div class="fin"><div class="t">${new Date(b.race_date).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}<br>${esc(b.race_time)}</div><div class="hn">${esc(b.horse)}</div>
 <div class="sub">${esc(nm(b.user_id))} · £${(+b.stake).toFixed(2)} @ ${odds(+b.price)} with ${esc(b.bookmaker)} · ${esc(b.course)}${b.pick_min&&+b.price<+b.pick_min?" · below our price":""}${+b.rule4?` · R4 ${Math.round(b.rule4*100)}p`:""}</div>
 <div class="r">${res=="pending"?`<span class="hd">to run</span>`:v==null?`<span class="hd">${esc(res)}</span>`:`<span class="${cls(v)}">${v<0?"−":"+"}£${Math.abs(v).toFixed(2)}</span>`}<small>${res!="pending"?esc({won:"Won",lost:"Lost",nr:"Non-runner",void:"Void"}[res]||res):""}${b.bsp?" · BSP "+odds(+b.bsp):""}</small></div></div>`}).join("");
 return h+`</div>`}
function friendsWire(){document.querySelectorAll("[data-fu]").forEach(b=>b.onclick=()=>{FRS.sel=b.dataset.fu;draw()});
 const f=document.getElementById("invf");if(f)f.onsubmit=e=>{e.preventDefault();adminAct({action:"invite",name:document.getElementById("inv_n").value.trim(),email:document.getElementById("inv_e").value.trim()})};
 document.querySelectorAll("[data-pa]").forEach(b=>b.onclick=()=>adminAct({action:b.dataset.pa,id:b.dataset.pid,email:b.dataset.pe,name:b.dataset.pn},b.dataset.pq||null))}
